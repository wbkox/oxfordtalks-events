name: Sync events from Luma

# Daily at 06:00 UTC, and by hand from the Actions tab after adding or changing an event on Luma.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pull events from Luma
        run: python3 scripts/sync-luma.py
      - name: Commit if anything changed
        run: |
          git config user.name "oxfordtalks-events bot"
          git config user.email "noreply@oxfordtalks.io"
          git add events.json events.js
          git diff --cached --quiet && echo "no change" || git commit -m "Events from Luma, $(date -u +%Y-%m-%d)" && git push
