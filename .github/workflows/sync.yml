name: Sync events from Luma, the latest talk and view counts from YouTube

# Every hour, so a talk published on YouTube reaches the homepage the same afternoon (it waited a day
# before, and on 22 Sep 2026 it waited three: the view-count step failed and took the commit with it).
# Also by hand from the Actions tab. Each step may fail on its own; whatever the others found is still
# committed. Nothing is committed when nothing changed, so the hourly runs leave no trail.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pull events from Luma
        continue-on-error: true
        run: python3 scripts/sync-luma.py
      - name: Install yt-dlp (ffmpeg is on the runner)
        run: python3 -m pip install -q --user yt-dlp
      - name: Find the latest talk on YouTube
        continue-on-error: true
        run: python3 scripts/sync-latest.py
      - name: Count the views on every talk
        continue-on-error: true
        run: python3 scripts/sync-views.py
      - name: Commit if anything changed
        run: |
          git config user.name "oxfordtalks-events bot"
          git config user.email "noreply@oxfordtalks.io"
          git add events.json events.js latest.json latest.js latest views.json views.js
          git diff --cached --quiet && echo "no change" || git commit -m "Events, latest talk and view counts, $(date -u +%Y-%m-%d)" && git push
